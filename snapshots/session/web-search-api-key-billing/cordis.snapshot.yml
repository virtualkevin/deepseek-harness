# Replay the recorded model responses without a DeepSeek API key.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: snapshot-other
            name: Other provider
            models:
              - id: other-model
